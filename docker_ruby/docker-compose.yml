version: '3'

volumes:
  mysql-data:

services:
  web:
    build: .
    ports: 
      - '3000:3000'
    volumes:
      - './dev.rails.me:/var/www/dev.rails.me/'
    tty: true
    stdin_open: true
    depends_on:
      - db
    links:
      - db

  db:
    image: mysql:5.7
    command: 'mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci'
    ports: 
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dev.rails.me
    volumes:
      - 'mysql-data:/var/lib/mysql'
