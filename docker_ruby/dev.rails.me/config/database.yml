default: &default
  adapter: mysql2
  encoding: utf8
  pool: 5
  host:     <%= ENV['DATABASE_HOST'] || 'db' %>
  database: <%= ENV['DATABASE_NAME'] || 'dev.rails.me' %>
  username: <%= ENV['DATABASE_USER'] || 'root' %>
  password: <%= ENV['DATABASE_PASSWORD'] || 'password' %>
  socket:   <%= ENV['DATABASE_SOCKET'] %>

development:
  <<: *default

production:
  <<: *default

staging:
  <<: *default
